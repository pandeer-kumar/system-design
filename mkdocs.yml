site_name: System Design Guide
site_description: A senior-level system design guide focused on concurrency and distributed systems, with 24 case studies.
site_url: https://pandeer-kumar.github.io/system-design/
repo_url: https://github.com/pandeer-kumar/system-design
repo_name: pandeer-kumar/system-design
edit_uri: edit/main/

# The guide's markdown lives at the repo root so it reads well on GitHub.
# scripts/build-site.sh copies it into build/docs before MkDocs runs.
docs_dir: build/docs
site_dir: build/site

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  # Two-column layout: the whole guide's table of contents on the left,
  # always expanded and grouped by section; the selected page on the right.
  # (The "on this page" headings sidebar is hidden in docs/stylesheets/layout.css.)
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/layout.css

plugins:
  - search

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

validation:
  links:
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

